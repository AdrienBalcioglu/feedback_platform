<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Platform</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Feedback Platform</h1>
        <div class="credit">Credit: <span id="credit">100</span> points</div>
        <div class="input-group">
            <input type="text" id="featureInput" placeholder="Enter feature name">
            <input type="text" id="descriptionInput" placeholder="Enter feature description">
            <button onclick="addFeature()">Add Feature</button>
            <input type="file" id="fileInput" accept=".csv" onchange="uploadCSV()">
            <button onclick="downloadTemplate()">Download Template</button>
        </div>
        <div class="feature-list-container">
            <ul id="featureList"></ul>
        </div>
        <div class="export-buttons">
            <button class="export-btn" onclick="exportCSV()">Export Report CSV</button>
            <button class="export-btn" onclick="exportPDF()">Export Report PDF</button>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.4.0/jspdf.umd.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
